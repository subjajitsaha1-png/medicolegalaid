<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030F24"/>
      <stop offset="55%" stop-color="#0F2D60"/>
      <stop offset="100%" stop-color="#450D19"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#00BEA5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00BEA5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#7A1F2E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7A1F2E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="45%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#E29CA7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- faint grid texture -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200"/>
    <path d="M120 0 V630 M240 0 V630 M360 0 V630 M480 0 V630 M600 0 V630 M720 0 V630 M840 0 V630 M960 0 V630 M1080 0 V630"/>
  </g>

  <!-- large watermark scales, right side -->
  <g transform="translate(870,60) scale(1.55)" opacity="0.14" stroke="#FFC107" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="100" y1="20" x2="100" y2="150"/>
    <line x1="35" y1="55" x2="165" y2="55"/>
    <circle cx="100" cy="20" r="6" fill="#FFC107" stroke="none"/>
    <path d="M35 55 L20 100 A18 18 0 0 0 50 100 Z"/>
    <path d="M165 55 L150 100 A18 18 0 0 0 180 100 Z"/>
    <rect x="70" y="150" width="60" height="10" rx="3" fill="#FFC107" stroke="none"/>
    <rect x="92" y="140" width="16" height="14" fill="#FFC107" stroke="none"/>
  </g>

  <!-- badge -->
  <g transform="translate(90,84)">
    <circle cx="34" cy="34" r="34" fill="url(#glow2)"/>
    <circle cx="34" cy="34" r="33" fill="#0F2D60" stroke="#FFC107" stroke-width="1.5"/>
    <g stroke="#FFC107" stroke-width="2" stroke-linecap="round" fill="none" transform="translate(8,8) scale(0.8)">
      <line x1="32" y1="12" x2="32" y2="44"/>
      <line x1="16" y1="22" x2="48" y2="22"/>
      <path d="M16 22 L10 35 A9 9 0 0 0 22 35 Z"/>
      <path d="M48 22 L42 35 A9 9 0 0 0 54 35 Z"/>
      <circle cx="32" cy="12" r="2.2" fill="#FFC107" stroke="none"/>
      <rect x="24" y="44" width="16" height="2.6" rx="1.2" fill="#FFC107" stroke="none"/>
    </g>
  </g>

  <!-- eyebrow -->
  <text x="90" y="230" font-family="DM Sans 9pt" font-size="22" font-weight="700" letter-spacing="4" fill="#FFC107">COPRA 2019 · MEDICOLEGAL PLATFORM</text>

  <!-- headline -->
  <text x="88" y="315" font-family="Playfair Display" font-size="72" font-weight="800" fill="#FFFFFF">MediLegal Assist</text>
  <text x="90" y="376" font-family="Playfair Display" font-size="40" font-weight="700" fill="url(#goldText)">Justice Through Expertise</text>

  <!-- subline -->
  <text x="90" y="440" font-family="DM Sans 9pt" font-size="24" fill="#C9D3E3">File grievances, negotiate settlements, and track commission cases</text>
  <text x="90" y="472" font-family="DM Sans 9pt" font-size="24" fill="#C9D3E3">with AI-powered legal guidance — zero cost for BPL patients.</text>

  <!-- divider -->
  <rect x="90" y="510" width="90" height="4" rx="2" fill="#FFC107"/>

  <!-- footer strip -->
  <text x="90" y="560" font-family="DM Sans 9pt" font-size="20" font-weight="600" fill="#7EC8BC">2,400+ Cases Filed</text>
  <text x="330" y="560" font-family="DM Sans 9pt" font-size="20" font-weight="600" fill="#E29CA7">Rs. 48Cr+ Compensation Won</text>
  <text x="660" y="560" font-family="DM Sans 9pt" font-size="20" font-weight="600" fill="#FFD54F">76% Settled Out-of-Court</text>
</svg>
